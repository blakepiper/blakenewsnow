# BlakeNewsNow Configuration
# Copy this file to ~/.config/blakenewsnow/config.yaml and customize

# ===========================================
# Weather Panel
# ===========================================
weather:
  # Set your location
  zip: "22314"  # Alexandria, VA
  # Alternative: lat/lon
  # location:
  #   lat: 38.8048
  #   lon: -77.0469

  # Refresh intervals (seconds)
  refresh_interval_sec: 300
  radar_refresh_sec: 120

# ===========================================
# Financial Panel
# ===========================================
financial:
  # Stock indices to display
  indices:
    - "^GSPC"   # S&P 500
    - "^DJI"    # Dow Jones
    - "^IXIC"   # NASDAQ

  # Cryptocurrencies (CoinGecko IDs)
  crypto:
    - "bitcoin"
    - "ethereum"

  # Number of top movers to show
  movers_count: 5

  # Refresh interval (seconds)
  refresh_interval_sec: 60

# ===========================================
# Headlines Panel
# ===========================================
headlines:
  sources:
    - type: "rss"
      url: "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml"
      name: "NYT"

    - type: "rss"
      url: "https://feeds.bbci.co.uk/news/rss.xml"
      name: "BBC"

    - type: "rss"
      url: "http://feeds.reuters.com/reuters/topNews"
      name: "Reuters"

  # Max headlines to display
  max_headlines: 15

  # Refresh interval (seconds)
  refresh_interval_sec: 60

# ===========================================
# Predictions Panel
# ===========================================
predictions:
  # Polymarket integration
  enabled: true
  refresh_interval_sec: 120

# ===========================================
# Ticker (Bottom Scrolling Bar)
# ===========================================
ticker:
  sources:
    - type: "rss"
      url: "https://news.google.com/rss"
      name: "Google News"

    - type: "rss"
      url: "https://feeds.finance.yahoo.com/rss/2.0/headline"
      name: "Yahoo Finance"

  # Speed: slow, medium, fast
  speed: "fast"

# ===========================================
# Advanced / Debug
# ===========================================
advanced:
  # Log level: debug, info, warning, error
  log_level: "info"

  # API server port
  api_port: 3001
